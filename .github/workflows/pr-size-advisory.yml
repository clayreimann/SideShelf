name: PR Size Advisory

# Metadata-only: runs trusted default-branch code; never checks out or executes PR code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  advisory:
    if: github.event.action != 'edited' || github.event.changes.base
    # Job-level so skipped title/body edits never cancel a real run.
    concurrency:
      group: pr-size-advisory-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted default-branch scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/pr-size
          persist-credentials: false

      - name: Update PR size advisory comment
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const { runAdvisory } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pr-size/github.mjs`);
            await runAdvisory({ github, context, core });
